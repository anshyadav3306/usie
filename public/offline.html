<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8f7be0">
<title>usie is offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #2b2540;
    background: linear-gradient(160deg, #ffeaf3, #f3ebff 55%, #e6e9ff); }
  .card { max-width: 320px; }
  .logo { width: 84px; height: 84px; border-radius: 28px; margin: 0 auto 20px; display: grid; place-items: center;
    background: linear-gradient(135deg, #d9ccff, #8f7be0); box-shadow: 0 8px 30px rgba(143,123,224,.25); }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #7d7694; line-height: 1.5; }
  button { font: inherit; font-weight: 700; color: #fff; background: #8f7be0; border: 0; border-radius: 16px;
    padding: 14px 28px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #bfaaf5; outline-offset: 2px; }
  @media (prefers-color-scheme: dark) {
    body { color: #efeaff; background: linear-gradient(160deg, #1b1630, #17132a 55%, #120f22); }
    p { color: #a79fc4; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="46" height="46" fill="#fff"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>usie needs a connection to load your chat. It will pick up right where you left off once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
